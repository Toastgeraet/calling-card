<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(700px 420px at 88% 0%, rgb(45 212 191 / 0.16), transparent 70%), #0b1120;
    color: #e2e8f0;
  }
  .skyline { position: absolute; right: 40px; bottom: -6px; width: 560px; color: #2dd4bf; opacity: 0.13; }
  .text { position: absolute; left: 80px; top: 78px; width: 700px; }
  .eyebrow { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 22px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #2dd4bf; margin: 0 0 28px; }
  h1 { font-size: 66px; line-height: 1.08; letter-spacing: -0.03em; margin: 0 0 30px; color: #f8fafc; }
  .slogan { font-size: 28px; line-height: 1.35; margin: 0; color: #94a3b8; }
  .slogan b { color: #e2e8f0; font-weight: 700; }
  .domain { position: absolute; left: 80px; bottom: 62px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 26px; font-weight: 700; color: #2dd4bf; }
  .portrait { position: absolute; right: 110px; top: 110px; width: 260px; height: 260px; border-radius: 50%; overflow: hidden;
    box-shadow: 0 0 0 8px #0b1120, 0 0 0 12px #2dd4bf; }
  .portrait img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); display: block; }
  .name { position: absolute; right: 110px; top: 400px; width: 260px; text-align: center; font-size: 26px; font-weight: 700; color: #f8fafc; }
</style></head>
